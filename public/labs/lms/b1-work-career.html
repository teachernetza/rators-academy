<body>
<div id="lab-root"></div>
<script type="application/json" id="lab-data">
{
  "level": "b1",
  "slug": "work-career",
  "title": "Work & Career",
  "topic": "Habla de tu experiencia laboral y de tu carrera con naturalidad.",
  "objectives": [
    "Usar vocabulario de trabajo, entrevistas y desarrollo profesional.",
    "Distinguir present perfect y past simple.",
    "Usar for, since, ever, never, already y yet.",
    "Contestar preguntas típicas de una entrevista de trabajo."
  ],
  "sections": [
    {
      "kicker": "Vocabulario",
      "title": "Trabajo y carrera",
      "intro": "Vocabulario que aparece en entrevistas y en el CV.",
      "vocab": [
        { "en": "apply for a job", "es": "postularse a un empleo" },
        { "en": "hire", "es": "contratar" },
        { "en": "be promoted", "es": "ser ascendido" },
        { "en": "skills", "es": "habilidades" },
        { "en": "deadline", "es": "fecha límite" },
        { "en": "coworker", "es": "compañero de trabajo" },
        { "en": "salary / raise", "es": "sueldo / aumento" },
        { "en": "resign / quit", "es": "renunciar" },
        { "en": "experience", "es": "experiencia" },
        { "en": "challenging", "es": "retador" }
      ],
      "content": "<div class=\"lab-box\">Cuidado: <code>apply for</code> a job (no <em>apply to</em>) y <code>work for</code> a company.</div>"
    },
    {
      "kicker": "Práctica",
      "title": "Práctica de vocabulario",
      "exercises": [
        {
          "type": "match",
          "q": "Relaciona cada término con su significado.",
          "pairs": [
            ["deadline", "fecha límite"],
            ["be promoted", "ser ascendido"],
            ["quit", "renunciar"],
            ["skills", "habilidades"]
          ],
          "explain": "Todas son palabras clave en una entrevista."
        },
        {
          "type": "mc",
          "q": "I decided to ______ for a marketing position.",
          "options": ["apply", "hire", "resign", "promote"],
          "answer": 0,
          "explain": "apply for = postularse."
        },
        {
          "type": "fill",
          "q": "Completa: The project was difficult but very ______. (retador)",
          "answers": ["challenging"],
          "solution": "challenging",
          "explain": "challenging = retador, exigente."
        },
        {
          "type": "mc",
          "q": "¿Qué pides cuando quieres ganar más?",
          "options": ["a deadline", "a raise", "a coworker"],
          "answer": 1,
          "explain": "a raise = un aumento de sueldo."
        }
      ]
    },
    {
      "kicker": "Gramática",
      "title": "Present perfect vs past simple",
      "content": "<div class=\"lab-box\"><b>Present perfect</b> (have/has + participio): experiencia o acción conectada con el presente, <b>sin</b> tiempo específico.<br><em>I have worked here for three years.</em> (sigo aquí)</div><div class=\"lab-box\"><b>Past simple</b>: acción terminada con tiempo específico.<br><em>I worked there in 2019.</em> (ya no)</div><p><b>Palabras clave:</b> <code>for</code> + periodo (for two years) · <code>since</code> + punto de inicio (since 2020) · <code>ever / never</code> (experiencia) · <code>already</code> (ya) · <code>yet</code> (todavía, en negativas y preguntas).</p>"
    },
    {
      "kicker": "Práctica",
      "title": "Práctica de gramática",
      "exercises": [
        {
          "type": "mc",
          "q": "I ______ in this company since 2021.",
          "options": ["work", "worked", "have worked", "am working"],
          "answer": 2,
          "explain": "since + present perfect: empezó en el pasado y continúa."
        },
        {
          "type": "mc",
          "q": "She ______ her last job two years ago.",
          "options": ["has left", "left", "leaves", "has been leaving"],
          "answer": 1,
          "explain": "'two years ago' marca un momento concreto → past simple."
        },
        {
          "type": "fill",
          "q": "Completa con for o since: They have known each other ______ ten years.",
          "answers": ["for"],
          "solution": "for",
          "explain": "for + duración; since + punto de inicio."
        },
        {
          "type": "order",
          "q": "Ordena la pregunta.",
          "words": ["Have", "you", "ever", "worked", "abroad"],
          "answer": "Have you ever worked abroad",
          "explain": "ever va entre el sujeto y el participio."
        },
        {
          "type": "fill",
          "q": "Completa: I haven't sent the report ______. (todavía)",
          "answers": ["yet"],
          "solution": "yet",
          "explain": "yet va al final en negativas y preguntas."
        }
      ]
    },
    {
      "kicker": "Reto",
      "title": "Reto final",
      "exercises": [
        {
          "type": "mc",
          "q": "¿Cuál es correcta?",
          "options": [
            "I have started this job last Monday.",
            "I started this job last Monday.",
            "I start this job last Monday."
          ],
          "answer": 1,
          "explain": "Con 'last Monday' (tiempo definido) va past simple."
        },
        {
          "type": "order",
          "q": "Ordena la oración.",
          "words": ["She", "has", "already", "finished", "the", "report"],
          "answer": "She has already finished the report",
          "explain": "already va entre el auxiliar y el participio."
        },
        {
          "type": "fill",
          "q": "Escribe en inglés: 'He trabajado aquí durante cinco años.'",
          "answers": ["I have worked here for five years", "I've worked here for five years"],
          "solution": "I have worked here for five years",
          "explain": "Present perfect + for + duración."
        }
      ]
    }
  ]
}
</script>
