{
  "level": "c1",

  "topic": "Argumenta sobre medio ambiente y sociedad con estructuras de alto nivel.",
  "objectives": [
    "Usar léxico preciso sobre sostenibilidad y políticas públicas.",
    "Dominar condicionales mixtos y estructuras con wish / if only.",

  "sections": [
    {
      "kicker": "Vocabulario",
      "title": "Medio ambiente y sociedad",
      "intro": "Léxico académico para debate, ensayo y examen.",

        { "en": "carbon footprint", "es": "huella de carbono" },
        { "en": "sustainable", "es": "sostenible" },
        { "en": "depletion", "es": "agotamiento (de recursos)" },
        { "en": "to curb", "es": "frenar, contener" },
        { "en": "offset", "es": "compensar" },
        { "en": "policy maker", "es": "responsable de políticas" },
        { "en": "inequality", "es": "desigualdad" },
        { "en": "widespread", "es": "generalizado" },
        { "en": "mitigate", "es": "mitigar" },
        { "en": "grassroots", "es": "de base, ciudadano" }
      ],
      "content": "<div class=\"lab-box\">Colocaciones de examen: <code>curb emissions</code>, <code>mitigate the impact</code>, <code>raise awareness</code>, <code>a pressing issue</code>.</div>"
    },
    {
      "kicker": "Práctica",
      "title": "Práctica de vocabulario",
      "exercises": [
        {
          "type": "match",
          "q": "Relaciona cada término con su significado.",
          "pairs": [
            ["curb", "frenar"],
            ["depletion", "agotamiento"],
            ["grassroots", "de base"],
            ["mitigate", "mitigar"]
          ],
          "explain": "Todas son de registro formal/académico."
        },
        {
          "type": "mc",
          "q": "Governments must act urgently to ______ greenhouse gas emissions.",
          "options": ["offset", "curb", "widespread", "deplete"],
          "answer": 1,
          "explain": "curb emissions es la colocación estándar."
        },
        {
          "type": "fill",
          "q": "Completa: Air pollution is a ______ problem in large cities. (generalizado)",
          "answers": ["widespread"],
          "solution": "widespread",
          "explain": "widespread = extendido, generalizado."
        },
        {
          "type": "mc",
          "q": "'To offset your carbon footprint' significa…",
          "options": [
            "compensar las emisiones que generas",
            "medir tu consumo de agua",
            "prohibir los coches"
          ],
          "answer": 0,
          "explain": "offset = compensar."
        }
      ]
    },
    {
      "kicker": "Gramática",
      "title": "Condicionales avanzados e inversión",
      "content": "<div class=\"lab-box\"><b>Condicional mixto</b>: condición pasada, resultado presente.<br><em>If we <code>had invested</code> in clean energy, we <code>would be</code> less dependent on oil today.</em></div><div class=\"lab-box\"><b>Wish / If only</b><br>Presente: <em>I wish I <code>had</code> more time.</em><br>Pasado: <em>If only they <code>had listened</code> to the scientists.</em><br>Molestia: <em>I wish he <code>would stop</code> complaining.</em></div><div class=\"lab-box\"><b>Inversión formal</b><br><code>Hardly had</code> the law passed <b>when</b> protests began.<br><code>Not only did</code> emissions fall, <b>but</b> jobs also increased.<br><code>Should you</code> need help, contact us. (= If you need)<br><code>Had we known</code>, we would have acted. (= If we had known)</div>"
    },
    {
      "kicker": "Práctica",
      "title": "Práctica de gramática",
      "exercises": [
        {
          "type": "mc",
          "q": "If the city had built more bike lanes, traffic ______ so heavy now.",
          "options": ["wouldn't be", "wouldn't have been", "won't be", "isn't"],
          "answer": 0,
          "explain": "Condicional mixto: pasado + resultado presente (would + base)."
        },
        {
          "type": "fill",
          "q": "Completa: If only we ______ (act) sooner, the damage would have been smaller.",
          "answers": ["had acted"],
          "solution": "had acted",
          "explain": "If only + past perfect para lamentar el pasado."
        },
        {
          "type": "mc",
          "q": "______ had the report been published when the debate began.",
          "options": ["Hardly", "Rarely if", "No longer", "Barely than"],
          "answer": 0,
          "explain": "Hardly had… when… es la estructura fija."
        },
        {
          "type": "order",
          "q": "Ordena la oración con inversión.",
          "words": ["Not", "only", "did", "emissions", "fall", "but", "costs", "dropped"],
          "answer": "Not only did emissions fall but costs dropped",
          "explain": "Not only + auxiliar + sujeto + verbo base."
        },
        {
          "type": "fill",
          "q": "Reescribe sin 'if': ______ you require further data, please contact the office.",
          "answers": ["Should"],
          "solution": "Should",
          "explain": "Should you… = If you should / If you…"
        }
      ]
    },
    {
      "kicker": "Reto",
      "title": "Reto final",
      "exercises": [
        {
          "type": "mc",
          "q": "¿Cuál oración es correcta?",
          "options": [
            "Had we knew the risks, we would have changed the plan.",
            "Had we known the risks, we would have changed the plan.",
            "Had we know the risks, we would change the plan."
          ],
          "answer": 1,
          "explain": "Had + sujeto + participio."
        },
        {
          "type": "order",
          "q": "Ordena la oración.",
          "words": ["I", "wish", "policy", "makers", "would", "listen", "to", "scientists"],
          "answer": "I wish policy makers would listen to scientists",
          "explain": "wish + would para expresar molestia o deseo de cambio."
        },
        {
          "type": "fill",
          "q": "Escribe en inglés: 'Si hubiéramos invertido antes, hoy seríamos líderes.' → If we ______ invested earlier, we would be leaders today.",
          "answers": ["had"],
          "solution": "had",
          "explain": "Condicional mixto: if + past perfect, would + base."
        }
      ]
    }
  ]
}
