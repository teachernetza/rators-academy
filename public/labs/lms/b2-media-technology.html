<div id="lab-root"></div>
<script type="application/json" id="lab-data">
{
  "level": "b2",
  "slug": "media-technology",
  "title": "Media & Technology",
  "topic": "Opina sobre medios, redes y tecnología con estructuras avanzadas.",
  "objectives": [
    "Manejar vocabulario de medios, redes sociales y tecnología.",
    "Usar la voz pasiva en varios tiempos verbales.",
    "Transformar frases a estilo indirecto (reported speech).",
    "Reportar noticias y opiniones con precisión."
  ],
  "sections": [
    {
      "kicker": "Vocabulario",
      "title": "Medios y tecnología",
      "intro": "Vocabulario de noticias, redes y tecnología actual.",
      "vocab": [
        { "en": "headline", "es": "titular" },
        { "en": "source", "es": "fuente" },
        { "en": "reliable", "es": "confiable" },
        { "en": "misleading", "es": "engañoso" },
        { "en": "to go viral", "es": "hacerse viral" },
        { "en": "device", "es": "dispositivo" },
        { "en": "privacy settings", "es": "ajustes de privacidad" },
        { "en": "data breach", "es": "filtración de datos" },
        { "en": "broadcast", "es": "transmitir" },
        { "en": "coverage", "es": "cobertura" }
      ],
      "content": "<div class=\"lab-box\">Colocaciones útiles: <code>a reliable source</code>, <code>breaking news</code>, <code>screen time</code>, <code>to post content</code>.</div>"
    },
    {
      "kicker": "Práctica",
      "title": "Práctica de vocabulario",
      "exercises": [
        {
          "type": "match",
          "q": "Relaciona cada término con su significado.",
          "pairs": [
            ["misleading", "engañoso"],
            ["source", "fuente"],
            ["data breach", "filtración de datos"],
            ["coverage", "cobertura"]
          ],
          "explain": "Todas aparecen en textos de noticias."
        },
        {
          "type": "mc",
          "q": "Always check whether the ______ is reliable before sharing an article.",
          "options": ["device", "source", "headline", "coverage"],
          "answer": 1,
          "explain": "source = fuente de la información."
        },
        {
          "type": "fill",
          "q": "Completa: The video ______ viral in less than a day. (verbo correcto)",
          "answers": ["went"],
          "solution": "went",
          "explain": "to go viral → went viral en pasado."
        },
        {
          "type": "mc",
          "q": "¿Qué significa 'a misleading headline'?",
          "options": [
            "un titular confiable",
            "un titular engañoso",
            "un titular largo"
          ],
          "answer": 1,
          "explain": "misleading = que induce al error."
        }
      ]
    },
    {
      "kicker": "Gramática",
      "title": "Voz pasiva y reported speech",
      "content": "<p><b>Voz pasiva</b>: <code>be</code> + participio. Usamos pasiva cuando el agente no importa o no se conoce.</p><div class=\"lab-box\">Present: The news <code>is broadcast</code> every hour.<br>Past: The app <code>was launched</code> in 2020.<br>Present perfect: Millions of accounts <code>have been hacked</code>.<br>Modal: Your data <code>must be protected</code>.</div><p><b>Reported speech</b>: el verbo retrocede un tiempo.</p><div class=\"lab-box\">\"I am tired\" → He said (that) he <code>was</code> tired.<br>\"I saw it\" → She said she <code>had seen</code> it.<br>\"Will you come?\" → He asked <b>if</b> I <code>would</code> come.<br>\"Where do you live?\" → She asked where I <code>lived</code>.</div>"
    },
    {
      "kicker": "Práctica",
      "title": "Práctica de gramática",
      "exercises": [
        {
          "type": "mc",
          "q": "The new platform ______ last month.",
          "options": ["was launched", "is launched", "has launch", "launched by"],
          "answer": 0,
          "explain": "Pasiva en pasado: was + participio."
        },
        {
          "type": "fill",
          "q": "Pasiva: Thousands of users ______ (affect, present perfect) by the data breach.",
          "answers": ["have been affected"],
          "solution": "have been affected",
          "explain": "have been + participio."
        },
        {
          "type": "mc",
          "q": "\"I'm working on the article.\" → She said she ______ on the article.",
          "options": ["is working", "was working", "has worked", "works"],
          "answer": 1,
          "explain": "Present continuous retrocede a past continuous."
        },
        {
          "type": "order",
          "q": "Ordena la oración reportada.",
          "words": ["He", "asked", "if", "I", "had", "read", "the", "article"],
          "answer": "He asked if I had read the article",
          "explain": "Pregunta sí/no reportada con 'if' y orden afirmativo."
        },
        {
          "type": "fill",
          "q": "Transforma a pasiva: 'Someone must protect your data.' → Your data ______ protected.",
          "answers": ["must be"],
          "solution": "must be",
          "explain": "modal + be + participio."
        }
      ]
    },
    {
      "kicker": "Reto",
      "title": "Reto final",
      "exercises": [
        {
          "type": "mc",
          "q": "¿Cuál oración es correcta?",
          "options": [
            "The report was wrote by a journalist.",
            "The report was written by a journalist.",
            "The report has wrote by a journalist."
          ],
          "answer": 1,
          "explain": "write → written (participio)."
        },
        {
          "type": "order",
          "q": "Ordena la oración.",
          "words": ["She", "told", "me", "that", "she", "would", "post", "it", "later"],
          "answer": "She told me that she would post it later",
          "explain": "will → would en estilo indirecto."
        },
        {
          "type": "fill",
          "q": "Escribe en pasiva: 'They broadcast the interview every Sunday.' → The interview ______ every Sunday.",
          "answers": ["is broadcast", "is broadcasted"],
          "solution": "is broadcast",
          "explain": "broadcast es invariable en participio."
        }
      ]
    }
  ]
}
</script>
